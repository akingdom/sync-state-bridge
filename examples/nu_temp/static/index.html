<!-- filename: index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Swarm vs Asteroids – SyncStateBridge</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0a1a; color: #eee; font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; }
        canvas { border: 1px solid #334; background: #111; display: block; cursor: crosshair; }
        #info { position: fixed; top: 10px; left: 10px; background: rgba(0,0,0,0.7); padding: 8px 14px; border-radius: 6px; font-size: 14px; pointer-events: none; z-index: 10; }
        #debug { position: fixed; top: 60px; left: 10px; background: rgba(0,0,0,0.7); padding: 6px 12px; border-radius: 4px; font-size: 12px; color: #0f0; pointer-events: none; z-index: 10; max-width: 300px; word-break: break-all; }
        #controls { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 12px; background: rgba(0,0,0,0.8); padding: 10px 20px; border-radius: 10px; flex-wrap: wrap; justify-content: center; z-index: 10; }
        #controls .key-info { color: #aaa; font-size: 13px; margin: 0 6px; }
        #controls .key-info strong { color: #fff; }
        #controls button { background: #1a2a4a; border: none; color: white; padding: 6px 14px; border-radius: 4px; cursor: pointer; font-size: 14px; }
        #controls button:hover { background: #2a4a7a; }
    </style>
</head>
<body>

<div id="stats" style="position:fixed; top:10px; right:10px; background:rgba(0,0,0,0.7); color:#0f0; padding:10px; border-radius:4px; font-family:monospace; font-size:12px; z-index:20; pointer-events:none;">
    <div>Health: <span id="health">1.00</span></div>
    <div>Particles: <span id="maxp">300</span></div>
    <div>Queue: <span id="queue">0</span>/<span id="capacity">0</span></div>
    <div>Drop rate: <span id="drop">0</span>/s</div>
</div>
<div id="info">Particles: <span id="count">0</span> | FPS: <span id="fps">0</span> | Aggression: <span id="agg">0.00</span></div>
<div id="debug">Players: <span id="pcount">0</span> | Tick: <span id="tick">0</span></div>

<canvas id="canvas" width="1000" height="800"></canvas>

<div id="controls">
    <span class="key-info"><strong>P1:</strong> WASD / Z X C</span>
    <span class="key-info"><strong>P2:</strong> Arrows / . 0</span>
    <span class="key-info"><strong>P3:</strong> IJKL / N M ,</span>
    <span style="color:#888;font-size:12px;">Press any key to join that player</span>
    <button id="reset">Reset Game</button>
</div>

<script type="importmap">
{
    "imports": {
        "state-sync-bridge": "/client/stateClient.js"
    }
}
</script>

<script type="module">
import { StateClient } from 'state-sync-bridge';

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const countEl = document.getElementById('count');
const fpsEl = document.getElementById('fps');
const aggEl = document.getElementById('agg');
const pcountEl = document.getElementById('pcount');
const tickEl = document.getElementById('tick');

let entities = { particle: [], asteroid: [], player: [], bullet: [] };

const client = new StateClient('http://localhost:8000/stream');

client.setCallbacks({
    onDelta: (delta) => {
        const store = client.getState();
        entities = {
            particle: Object.values(store.particle || {}),
            asteroid: Object.values(store.asteroid || {}),
            player: Object.values(store.player || {}),
            bullet: Object.values(store.bullet || {}),
        };
        pcountEl.textContent = entities.player.filter(p => p.alive).length;
        tickEl.textContent = client.localVersions['asteroid'] || 0;
        countEl.textContent = entities.particle.length;
        const agg = entities.particle.length > 0 ? Math.min(1, (300 - entities.particle.length) / 300) : 0;
        aggEl.textContent = agg.toFixed(2);
        requestAnimationFrame(render);
    },
    onManifest: (manifest) => console.log('Manifest initialized:', manifest),
    onError: (err) => console.error('StateClient network failure:', err),
});

client.connect();

function render() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    for (const a of entities.asteroid) {
        ctx.beginPath();
        ctx.arc(a.x, a.y, a.radius || 20, 0, 2 * Math.PI);
        ctx.fillStyle = '#666';
        ctx.fill();
        ctx.strokeStyle = '#999';
        ctx.lineWidth = 2;
        ctx.stroke();
    }

    for (const p of entities.particle) {
        ctx.beginPath();
        ctx.arc(p.x, p.y, 2, 0, 2 * Math.PI);
        ctx.fillStyle = p.color || '#fff';
        ctx.fill();
    }

    for (const p of entities.player) {
        if (!p.alive) continue;
        const size = p.render_size || 20;
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.angle || 0);

        ctx.beginPath();
        ctx.arc(0, 0, size, 0, 2 * Math.PI);
        ctx.strokeStyle = p.color || '#fff';
        ctx.globalAlpha = 0.2;
        ctx.lineWidth = 1;
        ctx.stroke();
        ctx.globalAlpha = 1.0;

        ctx.beginPath();
        ctx.moveTo(size, 0);
        ctx.lineTo(-size * 0.6, -size * 0.6);
        ctx.lineTo(-size * 0.6, size * 0.6);
        ctx.closePath();
        ctx.fillStyle = p.color || '#fff';
        ctx.fill();
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 2;
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(size, 0);
        ctx.lineTo(size * 2.5, 0);
        ctx.strokeStyle = p.color || '#fff';
        ctx.globalAlpha = 0.3;
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.globalAlpha = 1.0;
        ctx.restore();
    }

    for (const b of entities.bullet) {
        ctx.beginPath();
        ctx.arc(b.x, b.y, 4, 0, 2 * Math.PI);
        ctx.fillStyle = '#ffaa00';
        ctx.fill();
    }
}

let frameCount = 0;
let lastFpsUpdate = performance.now();
function fpsLoop(timestamp) {
    if (timestamp - lastFpsUpdate > 1000) {
        fpsEl.textContent = frameCount;
        frameCount = 0;
        lastFpsUpdate = timestamp;
    }
    frameCount++;
    requestAnimationFrame(fpsLoop);
}
fpsLoop(performance.now());

const keyMap = {
    'w': { pid: 0, key: 'up' }, 'a': { pid: 0, key: 'left' }, 's': { pid: 0, key: 'down' }, 'd': { pid: 0, key: 'right' },
    'z': { pid: 0, key: 'fire' }, 'x': { pid: 0, key: 'fire' }, 'c': { pid: 0, key: 'fire' },
    'ArrowUp': { pid: 1, key: 'up' }, 'ArrowLeft': { pid: 1, key: 'left' }, 'ArrowDown': { pid: 1, key: 'down' }, 'ArrowRight': { pid: 1, key: 'right' },
    '/': { pid: 1, key: 'fire' }, '\\': { pid: 1, key: 'fire' }, '0': { pid: 1, key: 'fire' },
    'i': { pid: 2, key: 'up' }, 'j': { pid: 2, key: 'left' }, 'k': { pid: 2, key: 'down' }, 'l': { pid: 2, key: 'right' },
    'n': { pid: 2, key: 'fire' }, 'm': { pid: 2, key: 'fire' }, ',': { pid: 2, key: 'fire' }
};

const keysDown = {};

function sendControls(pid) {
    const kd = keysDown[pid] || {};
    fetch('/update', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
            type: 'controls',
            id: `player_${pid}`,
            data: {
                up: !!kd.up,
                down: !!kd.down,
                left: !!kd.left,
                right: !!kd.right,
                fire: !!kd.fire
            }
        })
    }).catch(err => console.warn('Controls send error:', err));
}

document.addEventListener('keydown', (e) => {
    const mapping = keyMap[e.key];
    if (!mapping) return;
    if (e.key.startsWith('Arrow')) e.preventDefault();
    const { pid, key } = mapping;
    if (!keysDown[pid]) keysDown[pid] = {};
    if (key === 'fire') {
        keysDown[pid]['fire'] = true;
        sendControls(pid);
        setTimeout(() => { if (keysDown[pid]) keysDown[pid]['fire'] = false; }, 100);
        return;
    }
    keysDown[pid][key] = true;
    sendControls(pid);
});

document.addEventListener('keyup', (e) => {
    const mapping = keyMap[e.key];
    if (!mapping) return;
    const { pid, key } = mapping;
    if (key === 'fire') return;
    if (!keysDown[pid]) keysDown[pid] = {};
    keysDown[pid][key] = false;
    sendControls(pid);
});

document.getElementById('reset').onclick = () => {
    if (confirm('Reset game?')) {
        fetch('/update', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ type: 'game:reset' })
        });
        entities = { particle: [], asteroid: [], player: [], bullet: [] };
        render();
    }
};

function updateStats() {
    fetch('/stats')
        .then(r => r.json())
        .then(data => {
            if (data.health !== undefined) document.getElementById('health').textContent = data.health.toFixed(2);
            if (data.max_particles !== undefined) document.getElementById('maxp').textContent = data.max_particles;
            if (data.queue_depth !== undefined) document.getElementById('queue').textContent = data.queue_depth;
            if (data.capacity !== undefined) document.getElementById('capacity').textContent = data.capacity;
            if (data.drop_rate !== undefined) document.getElementById('drop').textContent = data.drop_rate.toFixed(1);
        })
        .catch(() => {});
}
setInterval(updateStats, 2000);
</script>
</body>
</html>
