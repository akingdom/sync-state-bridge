<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Swarm vs Asteroids – SyncStateBridge</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0a1a; color: #eee; font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; }
        canvas { border: 1px solid #334; background: #111; display: block; cursor: crosshair; }
        #info { position: fixed; top: 10px; left: 10px; background: rgba(0,0,0,0.7); padding: 8px 14px; border-radius: 6px; font-size: 14px; pointer-events: none; z-index: 10; }
        #debug { position: fixed; top: 60px; left: 10px; background: rgba(0,0,0,0.7); padding: 6px 12px; border-radius: 4px; font-size: 12px; color: #0f0; pointer-events: none; z-index: 10; max-width: 300px; word-break: break-all; }
        #controls { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 12px; background: rgba(0,0,0,0.8); padding: 10px 20px; border-radius: 10px; flex-wrap: wrap; justify-content: center; z-index: 10; }
        #controls .key-info { color: #aaa; font-size: 13px; margin: 0 6px; }
        #controls .key-info strong { color: #fff; }
        #controls button { background: #1a2a4a; border: none; color: white; padding: 6px 14px; border-radius: 4px; cursor: pointer; font-size: 14px; }
        #controls button:hover { background: #2a4a7a; }
    </style>
</head>
<body>

<div id="info">Particles: <span id="count">0</span> | FPS: <span id="fps">0</span> | Aggression: <span id="agg">0.00</span></div>
<div id="debug">Players: <span id="pcount">0</span> | Tick: <span id="tick">0</span></div>

<canvas id="canvas" width="1000" height="800"></canvas>

<div id="controls">
    <span class="key-info"><strong>P1:</strong> WASD / Z X C</span>
    <span class="key-info"><strong>P2:</strong> Arrows / . 0</span>
    <span class="key-info"><strong>P3:</strong> IJKL / N M ,</span>
    <span style="color:#888;font-size:12px;">Press any key to join that player</span>
    <button id="reset">Reset Game</button>
</div>

<script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const countEl = document.getElementById('count');
    const fpsEl = document.getElementById('fps');
    const aggEl = document.getElementById('agg');
    const pcountEl = document.getElementById('pcount');
    const tickEl = document.getElementById('tick');

    const entities = { particle: [], asteroid: [], player: [], bullet: [] };
    let lastTick = 0;
    let joinedPlayers = new Set();
    let eventSource = null;

    function render() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        for (const a of entities.asteroid) {
            ctx.beginPath();
            ctx.arc(a.x, a.y, a.radius || 20, 0, 2 * Math.PI);
            ctx.fillStyle = '#666';
            ctx.fill();
            ctx.strokeStyle = '#999';
            ctx.lineWidth = 2;
            ctx.stroke();
        }

        for (const p of entities.particle) {
            ctx.beginPath();
            ctx.arc(p.x, p.y, 2, 0, 2 * Math.PI);
            ctx.fillStyle = p.color || '#fff';
            ctx.fill();
        }

        for (const p of entities.player) {
            if (!p.alive) continue;
            const size = p.render_size || 20;
            ctx.save();
            ctx.translate(p.x, p.y);
            ctx.rotate(p.angle || 0);

            ctx.beginPath();
            ctx.arc(0, 0, size, 0, 2 * Math.PI);
            ctx.strokeStyle = p.color || '#fff';
            ctx.globalAlpha = 0.2;
            ctx.lineWidth = 1;
            ctx.stroke();
            ctx.globalAlpha = 1.0;

            ctx.beginPath();
            ctx.moveTo(size, 0);
            ctx.lineTo(-size * 0.6, -size * 0.6);
            ctx.lineTo(-size * 0.6, size * 0.6);
            ctx.closePath();
            ctx.fillStyle = p.color || '#fff';
            ctx.fill();
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 2;
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(size, 0);
            ctx.lineTo(size * 2.5, 0);
            ctx.strokeStyle = p.color || '#fff';
            ctx.globalAlpha = 0.3;
            ctx.lineWidth = 2;
            ctx.stroke();
            ctx.globalAlpha = 1.0;
            ctx.restore();

            if (p.active) {
                ctx.beginPath();
                ctx.arc(p.x, p.y, size * 1.6, 0, 2 * Math.PI);
                ctx.strokeStyle = p.color || '#fff';
                ctx.globalAlpha = 0.3;
                ctx.lineWidth = 1;
                ctx.stroke();
                ctx.globalAlpha = 1.0;
            }
        }

        for (const b of entities.bullet) {
            ctx.beginPath();
            ctx.arc(b.x, b.y, 4, 0, 2 * Math.PI);
            ctx.fillStyle = '#ffaa00';
            ctx.fill();
        }

        pcountEl.textContent = entities.player.filter(p => p.alive).length;
        tickEl.textContent = lastTick;
        countEl.textContent = entities.particle.length;
    }

    let frameCount = 0;
    let lastFpsUpdate = 0;
    function fpsLoop(timestamp) {
        if (timestamp - lastFpsUpdate > 1000) {
            fpsEl.textContent = frameCount;
            frameCount = 0;
            lastFpsUpdate = timestamp;
        }
        frameCount++;
        requestAnimationFrame(fpsLoop);
    }
    fpsLoop();

    function renderLoop() {
        render();
        requestAnimationFrame(renderLoop);
    }
    renderLoop();

    function connectToStream() {
        if (eventSource) {
            eventSource.close();
            eventSource = null;
        }

        entities.particle = [];
        entities.asteroid = [];
        entities.player = [];
        entities.bullet = [];
        lastTick = 0;
        joinedPlayers.clear();

        // Generate a unique client ID (gateway may ignore it)
        const clientId = 'client_' + Math.random().toString(36).substring(2, 10);

        eventSource = new EventSource(`/stream?versions={}&client_id=${clientId}`);

        eventSource.addEventListener('manifest', (e) => {
            console.log('Manifest:', e.data);
        });

        eventSource.addEventListener('delta', (e) => {
            try {
                const data = JSON.parse(e.data);
                const tick = data.tick;

                // --- SNAPSHOT ---
                if (data.type === 'SNAPSHOT') {
                    console.log('Snapshot received');
                    entities.particle = [];
                    entities.asteroid = [];
                    entities.player   = [];
                    entities.bullet   = [];
                    for (const entity of data.entities) {
                        const list = entities[entity.type] || [];
                        list.push({ id: entity.id, ...entity });
                    }
                    lastTick = tick || 0;
                    return;
                }

                // --- DELTAS ---
                if (tick > lastTick && data.deltas) {
                    lastTick = tick;
                    for (const d of data.deltas) {
                        const id = d.id;
                        const op = d.op;
                        const type = d.type;
                        const changes = d.changes || {};

                        if (op === 'delete') {
                            if (type === 'particle') {
                                entities.particle = entities.particle.filter(e => e.id !== id);
                            } else if (type === 'asteroid') {
                                entities.asteroid = entities.asteroid.filter(e => e.id !== id);
                            } else if (type === 'player') {
                                entities.player = entities.player.filter(e => e.id !== id);
                            } else if (type === 'bullet') {
                                entities.bullet = entities.bullet.filter(e => e.id !== id);
                            }
                            continue;
                        }

                        let list = null;
                        if (type === 'particle') list = entities.particle;
                        else if (type === 'asteroid') list = entities.asteroid;
                        else if (type === 'player') list = entities.player;
                        else if (type === 'bullet') list = entities.bullet;
                        if (!list) continue;

                        const idx = list.findIndex(e => e.id === id);
                        const entity = { id, ...changes };
                        if (idx !== -1) {
                            list[idx] = entity;
                        } else {
                            list.push(entity);
                        }
                    }
                    const agg = entities.particle.length > 0 ? Math.min(1, (300 - entities.particle.length) / 300) : 0;
                    aggEl.textContent = agg.toFixed(2);
                }
            } catch (err) {
                console.error('Error parsing delta:', err);
            }
        });

        eventSource.addEventListener('keepalive', () => {});
        eventSource.addEventListener('error', (e) => {
            console.error('EventSource error:', e);
            setTimeout(connectToStream, 100);
        });
    }

    connectToStream();

    // ------------------------------------------------------------------
    // Input and controls
    // ------------------------------------------------------------------
    const keyMap = {
        'w': { pid: 0, key: 'up' },
        'a': { pid: 0, key: 'left' },
        's': { pid: 0, key: 'down' },
        'd': { pid: 0, key: 'right' },
        'z': { pid: 0, key: 'fire' },
        'x': { pid: 0, key: 'fire' },
        'c': { pid: 0, key: 'fire' },
        'ArrowUp': { pid: 1, key: 'up' },
        'ArrowLeft': { pid: 1, key: 'left' },
        'ArrowDown': { pid: 1, key: 'down' },
        'ArrowRight': { pid: 1, key: 'right' },
        '/': { pid: 1, key: 'fire' },
        '\\': { pid: 1, key: 'fire' },
        '0': { pid: 1, key: 'fire' },
        'i': { pid: 2, key: 'up' },
        'j': { pid: 2, key: 'left' },
        'k': { pid: 2, key: 'down' },
        'l': { pid: 2, key: 'right' },
        'n': { pid: 2, key: 'fire' },
        'm': { pid: 2, key: 'fire' },
        ',': { pid: 2, key: 'fire' },
    };

    const keysDown = {};

    function joinPlayer(pid) {
        if (!joinedPlayers.has(pid)) {
            joinedPlayers.add(pid);
            fetch('/join', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ pid }) });
            console.log(`Auto-join player ${pid}`);
        }
    }

    document.addEventListener('keydown', (e) => {
        const key = e.key;
        if (key.startsWith('Arrow') || key === '/' || key === '\\' || key === ',' || key === '0') e.preventDefault();
        const mapping = keyMap[key];
        if (!mapping) return;
        const pid = mapping.pid;
        joinPlayer(pid);
        const k = mapping.key;
        if (k === 'fire') {
            fetch('/fire', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ pid }) });
            return;
        }
        if (!keysDown[pid]) keysDown[pid] = {};
        keysDown[pid][k] = true;
        sendMove(pid);
    });

    document.addEventListener('keyup', (e) => {
        const key = e.key;
        if (key.startsWith('Arrow') || key === '/' || key === '\\' || key === ',' || key === '0') e.preventDefault();
        const mapping = keyMap[key];
        if (!mapping) return;
        const pid = mapping.pid;
        const k = mapping.key;
        if (k === 'fire') return;
        if (!keysDown[pid]) keysDown[pid] = {};
        keysDown[pid][k] = false;
        sendMove(pid);
    });

    function sendMove(pid) {
        const kd = keysDown[pid] || {};
        fetch('/move', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                pid,
                keys: {
                    up: !!kd.up,
                    down: !!kd.down,
                    left: !!kd.left,
                    right: !!kd.right,
                }
            })
        });
    }

    document.getElementById('reset').onclick = () => {
        if (confirm('Reset game?')) {
            entities.particle = [];
            entities.asteroid = [];
            entities.player = [];
            entities.bullet = [];
            lastTick = 0;
            joinedPlayers.clear();
            fetch('/reset', { method: 'POST' });
            setTimeout(connectToStream, 100);
        }
    };
</script>
</body>
</html>
